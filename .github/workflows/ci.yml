name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build shared
        run: npm run build -w shared

      # motor-channels é cross-workspace devDep do orchestrator (integration
      # test C-MX-07 PR7 importa via @ascendimacy/motor-channels). package.json
      # aponta pra ./dist via exports, então vitest falha resolver entry sem
      # build. Build aqui antes dos tests pra desbloquear orchestrator.
      - name: Build motor-channels
        run: npm run build -w packages/motor-channels

      # motor-execucao é dependência de runtime do BFF (ebrota-console-bff).
      # O BFF importa via subpaths (@ascendimacy/motor-execucao/cards-repo, drill-repo, mc1-repo etc).
      # Esses subpaths só existem após o build (apontam para ./dist).
      # Sem isso, vitest no BFF falha com "Does the file exist?".
      - name: Build motor-execucao (required by BFF + integration tests)
        run: npm run build -w motor-execucao

      - name: Run tests
        run: npm test

      - name: Build all
        run: npm run build

      - name: Smoke test
        env:
          USE_MOCK_LLM: "true"
        run: npm run smoke
